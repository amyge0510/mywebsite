<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>my small corner</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon.png" type="image/png" sizes="64x64">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="description" content="A cozy little room: the records on the wall are my projects.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Special+Elite&family=Yellowtail&family=Satisfy&family=Caveat:wght@500;700&family=DM+Sans:wght@400;500;700&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="stage-wrap">
    <svg id="room" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid meet" role="img"
      aria-label="A warm room with a wall of records, a record player, a lamp, a framed photo, a bulletin board, an orange beanbag and an instant camera."></svg>
  </main>
  <div id="grain" aria-hidden="true"></div>
  <button class="pan-arrow" id="pan-left" aria-label="Look left"><span></span></button>
  <button class="pan-arrow" id="pan-right" aria-label="Look right"><span></span></button>


  <div id="hud" aria-live="polite">
    <span class="eq"><i></i><i></i><i></i></span>
    <span class="title"></span>
    <div id="spotify-embed"></div>
    <button type="button" aria-label="Stop">stop</button>
  </div>

  <div id="toast" aria-live="polite"></div>

  <!-- project modal: the record opens like a gatefold sleeve -->
  <div class="modal" id="project-modal" aria-hidden="true" role="dialog" aria-labelledby="project-title">
    <div class="backdrop" data-close></div>
    <div class="gatefold" id="gatefold">
      <div class="gf-inside">
        <div class="gf-disc" id="gf-disc"></div>
        <div class="gf-pocket"></div>
      </div>
      <div class="gf-cover">
        <div class="gf-face gf-front" id="project-cover"></div>
        <div class="gf-face gf-back">
          <h2 class="gf-label" id="project-title"></h2>
          <p class="sub" id="project-sub"></p>
          <div class="tags" id="project-tags"></div>
          <p id="project-blurb"></p>
          <a id="project-link" class="btn">open project →</a>
        </div>
      </div>
      <button class="x" data-close aria-label="Close">×</button>
    </div>
  </div>

  <!-- camera modal: take an instant photo -->
  <div class="modal" id="camera-modal" aria-hidden="true" role="dialog" aria-labelledby="camera-heading">
    <div class="backdrop" data-close></div>
    <div class="card cam-card">
      <button class="x" data-close aria-label="Close">×</button>
      <h2 id="camera-heading" class="label-font">say cheese</h2>
      <div class="cam-stage">
        <div class="viewfinder" id="viewfinder">
          <video id="cam-video" playsinline autoplay muted></video>
          <div class="cam-msg" id="cam-msg">starting the camera…</div>
          <div class="flash" id="cam-flash"></div>
        </div>
        <div class="print-slot"><img id="polaroid" alt="Your instant photo"></div>
      </div>
      <div class="cam-actions">
        <button type="button" id="cam-snap">● snap</button>
        <a class="btn" id="cam-save" download="my-small-corner-polaroid.png" hidden>save photo</a>
        <button type="button" id="cam-again" class="ghost" hidden>take another</button>
      </div>
    </div>
  </div>

  <!-- notes modal: a restaurant order pad -->
  <div class="modal" id="note-modal" aria-hidden="true" role="dialog" aria-label="Leave a note">
    <div class="backdrop" data-close></div>
    <div class="pad-wrap">
      <div class="pad" id="pad">
        <div class="pad-depth"></div>
        <form class="pad-page" id="note-form" autocomplete="off">
          <label class="pad-name"><span>NAME</span><input name="name" maxlength="24" aria-label="Your name" spellcheck="false" data-gramm="false"></label>
          <h2 class="pad-hey">Hey there!</h2>
          <p class="pad-sub">THANKS FOR VISITING</p>
          <div class="pad-lower">
            <textarea name="message" maxlength="140" rows="6" aria-label="Your note" required spellcheck="false" data-gramm="false" data-gramm_editor="false" data-enable-grammarly="false"></textarea>
            <p class="pad-hint">let me know what to build next, or just leave a note :)</p>
          </div>
        </form>
        <div class="pad-flip f3"></div>
        <div class="pad-flip f2"></div>
        <div class="pad-flip cover"></div>
        <div class="pad-binding"></div>
      </div>
      <div class="pad-actions">
        <button type="submit" form="note-form" id="pad-pin">pin it to the board</button>
      </div>
      <button class="x" data-close aria-label="Close">×</button>
    </div>
  </div>

  <nav id="a11y-nav" class="sr-only" aria-label="Room controls"></nav>

  <script src="js/data.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/notes.js"></script>
  <script src="js/spotify.js"></script>
  <script src="js/art.js"></script>
  <script src="js/camera.js"></script>
  <script src="js/cat.js"></script>
  <script src="js/room.js"></script>
</body>
</html>
