<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>my little room</title>
  <meta name="description" content="A cozy little room: the records on the wall are my projects.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Caveat:wght@500;700&family=DM+Sans:wght@400;500;700&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="stage-wrap">
    <svg id="room" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid meet" role="img"
      aria-label="A warm room with a wall of records, a record player, a lamp, a framed photo, a bulletin board, an orange lounge chair and a fluffy seal-point cat."></svg>
  </main>
  <div id="grain" aria-hidden="true"></div>
  <div id="tooltip" role="status" aria-live="polite"></div>
  <div id="record-card" aria-live="polite">
    <img alt="">
    <div class="meta"><b class="t"></b><span class="a"></span><button type="button">▶  play</button><small class="n"></small></div>
  </div>

  <div id="hint">✦ hover &amp; click around ✦</div>

  <div id="hud" aria-live="polite">
    <span class="eq"><i></i><i></i><i></i></span>
    <span class="title"></span>
    <button type="button">stop</button>
  </div>

  <div id="toast" aria-live="polite"></div>

  <!-- project modal -->
  <div class="modal" id="project-modal" aria-hidden="true" role="dialog" aria-labelledby="project-title">
    <div class="backdrop" data-close></div>
    <div class="card">
      <button class="x" data-close aria-label="Close">×</button>
      <div class="project">
        <div id="project-cover"></div>
        <div>
          <h2 id="project-title"></h2>
          <p class="sub" id="project-sub"></p>
          <div class="tags" id="project-tags"></div>
          <p id="project-blurb"></p>
          <a id="project-link" class="btn">open project →</a>
        </div>
      </div>
    </div>
  </div>

  <!-- notes modal -->
  <div class="modal" id="note-modal" aria-hidden="true" role="dialog" aria-labelledby="note-heading">
    <div class="backdrop" data-close></div>
    <div class="card">
      <button class="x" data-close aria-label="Close">×</button>
      <h2 id="note-heading">leave a note</h2>
      <form id="note-form">
        <div class="chips">
          <label><input type="radio" name="topic" value="project idea" checked><span>project idea</span></label>
          <label><input type="radio" name="topic" value="about the wall"><span>about the wall</span></label>
          <label><input type="radio" name="topic" value="hello"><span>just saying hi</span></label>
        </div>
        <textarea name="message" maxlength="140" rows="3" placeholder="what would you like to see next?" required></textarea>
        <div class="row">
          <input name="name" maxlength="24" placeholder="your name (optional)">
          <span id="note-count">0/140</span>
          <button type="submit" class="btn">pin it</button>
        </div>
        <small id="note-shared"></small>
      </form>
      <h3>on the board</h3>
      <ul id="note-list"></ul>
    </div>
  </div>

  <!-- photo modal -->
  <div class="modal" id="photo-modal" aria-hidden="true" role="dialog" aria-label="A and C">
    <div class="backdrop" data-close></div>
    <div class="card photo-card">
      <button class="x" data-close aria-label="Close">×</button>
      <img src="assets/img/us.jpg" alt="The two of us at a café, framed by red cross-stitched initials A and C">
    </div>
  </div>

  <nav id="a11y-nav" class="sr-only" aria-label="Room controls"></nav>

  <script src="js/data.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/notes.js"></script>
  <script src="js/art.js"></script>
  <script src="js/cat.js"></script>
  <script src="js/room.js"></script>
</body>
</html>
